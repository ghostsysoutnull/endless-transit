plugins {
    id 'groovy'
    id 'application'
}

buildDir = 'build/gradle'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy-all:5.0.0'
    testImplementation 'org.apache.groovy:groovy-test:5.0.0'
    
    // JUnit 5 Platform & Jupiter
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.platform:junit-platform-engine'
}

application {
    mainClass = 'com.endlesstransit.Main'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src/main/groovy']
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Custom task to run the game through the custom entry point script
task runGame(type: Exec) {
    dependsOn classes
    commandLine './run.sh'
}
