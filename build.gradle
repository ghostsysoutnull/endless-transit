plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy-all:4.0.15'
    testImplementation 'org.apache.groovy:groovy-test:4.0.15'
    
    // JUnit 5 Platform & Jupiter
    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    
    // JUnit 4 (Vintage) for co-existence during migration
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

application {
    mainClass = 'com.endlesstransit.Main'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src/main/groovy']
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Custom task to run the game through the custom entry point script
task runGame(type: Exec) {
    dependsOn classes
    commandLine './run.sh'
}
